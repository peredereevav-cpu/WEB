<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды | Лабораторная работа 10</title>
    <link rel="stylesheet" href="lab10.css">
</head>
<body>
    <div class="weather-container">
        <div class="search-box">
            <input type="text" id="city-search" placeholder="Введите название города...">
            <button id="search-btn">Поиск</button>
            <div id="search-results" class="search-results"></div>
        </div>

        <div id="location-info" class="location-info">
            <h2 id="city-name">Загрузка...</h2>
            <p id="coordinates"></p>
        </div>

        <div class="view-toggle">
            <button id="daily-view-btn" class="active">По дням</button>
            <button id="hourly-view-btn">По часам (сегодня)</button>
        </div>

        <div class="carousel-container">
            <button id="prev-btn" class="nav-arrow">&lt;</button>
            <div id="weather-cards" class="weather-cards">
                <!-- Карточки будут добавлены через JavaScript -->
            </div>
            <button id="next-btn" class="nav-arrow">&gt;</button>
        </div>

        <div class="carousel-dots" id="carousel-dots">
            <!-- Точки навигации -->
        </div>

        <div id="loading" class="loading">Загрузка прогноза погоды...</div>
        <div id="error-message" class="error-message"></div>
    </div>

    <script src="lab10.js"></script>
</body>
</html>
